<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 2048 2048">
  <!-- Full-bleed flat background: no circular container or boundary. -->
  <rect width="2048" height="2048" fill="#080808"/>

  <!-- Reference-faithful ElectrumX atom, rendered in one solid color. -->
  <g fill="none" stroke="#1377E7" stroke-width="104" stroke-linecap="round">
    <ellipse cx="1024" cy="1024" rx="854" ry="382"/>
    <ellipse cx="1024" cy="1024" rx="854" ry="382" transform="rotate(60 1024 1024)"/>
    <ellipse cx="1024" cy="1024" rx="854" ry="382" transform="rotate(120 1024 1024)"/>
  </g>

  <!-- Canonical flat Litecoin glyph; no ring, halo, coin, bevel, or shadow. -->
  <text x="1024" y="1038"
        fill="#1377E7"
        font-family="DejaVu Sans"
        font-size="620"
        font-weight="700"
        text-anchor="middle"
        dominant-baseline="middle">Ł</text>
</svg>
