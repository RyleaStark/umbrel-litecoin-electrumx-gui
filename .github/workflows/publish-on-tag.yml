name: Build and publish Litecoin ElectrumX GUI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ghcr.io/ryleastark/umbrel-litecoin-electrumx-gui:${{ github.ref_name }}-${{ matrix.suffix }}

  publish-index:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture index
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/ryleastark/umbrel-litecoin-electrumx-gui:${GITHUB_REF_NAME} \
            ghcr.io/ryleastark/umbrel-litecoin-electrumx-gui:${GITHUB_REF_NAME}-amd64 \
            ghcr.io/ryleastark/umbrel-litecoin-electrumx-gui:${GITHUB_REF_NAME}-arm64
