services:
  app:
    build: .
    depends_on:
      - electrumx
      - litecoind
    environment:
      PORT: "3008"
      ELECTRUM_HIDDEN_SERVICE: "notyetset.onion"
      ELECTRUM_LOCAL_SERVICE: "localhost"
      ELECTRUM_HOST: electrumx
      ELECTRUM_PUBLIC_CONNECTION_PORT: "51003"
      ELECTRUM_RPC_PORT: "8000"
      LITECOIN_HOST: litecoind
      RPC_PORT: "19443"
      RPC_USER: umbrel
      RPC_PASSWORD: umbrel
    ports:
      - "3008:3008"
    restart: on-failure

  electrumx:
    image: ghcr.io/ryleastark/umbrel-electrumx-ltc:v2.0.0-umbrel.1@sha256:50d41f338a0f29fadd2655012944bdde80aa7b9ca07b876563411a90410595c8
    user: "1000:1000"
    init: true
    depends_on:
      - litecoind
    environment:
      DAEMON_URL: "http://umbrel:umbrel@litecoind:19443"
      COIN: Litecoin
      NET: regtest
      DB_DIRECTORY: /data
      DB_ENGINE: rocksdb
      SERVICES: "tcp://0.0.0.0:51003,rpc://0.0.0.0:8000"
      PEER_DISCOVERY: "off"
      PEER_ANNOUNCE: "false"
      CACHE_MB: "512"
    volumes:
      - ./data/electrumx:/data
    ports:
      - "51003:51003"
    restart: on-failure

  litecoind:
    image: litecoinproject/litecoin-core:0.21.5.5@sha256:d541077a067257620648371ab88cc1fb7eb3b738ad3fc8981d75008a73df3561
    command:
      - -regtest=1
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=umbrel
      - -rpcpassword=umbrel
      - -rpcport=19443
      - -port=19444
      - -fallbackfee=0.0002
    volumes:
      - ./data/litecoin:/home/litecoin/.litecoin
    restart: on-failure
