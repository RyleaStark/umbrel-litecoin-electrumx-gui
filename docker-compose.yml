services:
  app:
    build: .
    depends_on:
      - electrumx
      - bitcoind
    environment:
      PORT: "3007"
      ELECTRUM_HIDDEN_SERVICE: "notyetset.onion"
      ELECTRUM_LOCAL_SERVICE: "umbrel.local"
      ELECTRUM_HOST: electrumx
      ELECTRUM_PUBLIC_CONNECTION_PORT: "50001"
      ELECTRUM_RPC_PORT: "8000"
      BITCOIN_HOST: bitcoind
      RPC_PORT: "18443"
      RPC_USER: umbrel
      RPC_PASSWORD: umbrel
    ports:
      - "3007:3007"
    restart: on-failure

  electrumx:
    build:
      context: .
      dockerfile: runtime/electrumx/Dockerfile
    user: "1000:1000"
    init: true
    depends_on:
      - bitcoind
    environment:
      DAEMON_URL: "http://umbrel:umbrel@bitcoind:18443"
      COIN: Bitcoin
      NET: regtest
      DB_DIRECTORY: /data
      DB_ENGINE: rocksdb
      SERVICES: "tcp://0.0.0.0:50001,rpc://0.0.0.0:8000"
      PEER_DISCOVERY: "off"
      PEER_ANNOUNCE: ""
      CACHE_MB: "512"
    volumes:
      - electrumx-data:/data
    ports:
      - "50001:50001"
    restart: on-failure

  bitcoind:
    image: bitcoin/bitcoin:31.1@sha256:da25cedc66b1daefff9f412ee196c901a899c3fa68a33b20849c3e08b5c40d63
    command:
      - -regtest=1
      - -server=1
      - -txindex=1
      - -txospenderindex=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=umbrel
      - -rpcpassword=umbrel
      - -rpcport=18443
      - -port=18444
      - -fallbackfee=0.0002
    volumes:
      - ./data/bitcoin:/home/bitcoin/.bitcoin
    restart: on-failure

volumes:
  electrumx-data:
